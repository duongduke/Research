# Top-up cohort stack (D-035): CVE-2023-23752 (Joomla 4.2.7 / 4.2.8) + CVE-2023-6553
# (Backup Migration 1.3.7/1.3.8 on WordPress 6.7.1).
# LAB ONLY — every published port binds 127.0.0.1 on the lab VM. No CGI.
name: topup-lab
networks:
  topup-net: {name: topup-net, driver: bridge}
volumes:
  mariadb-data:
services:
  db:
    # mariadb:10.11 (pinned digest, reused from the existing lab stacks)
    image: mariadb@sha256:7db29378d4fdab73f8123bbc2b48905c90d1a4b00cf848b028f1e81e623257f2
    container_name: topup-db
    restart: unless-stopped
    environment: {MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:-changeme}"}
    ports: ["127.0.0.1:13313:3306"]
    volumes:
      - mariadb-data:/var/lib/mysql
      - ./db-init:/docker-entrypoint-initdb.d:ro
    networks: [topup-net]
    healthcheck: {test: ["CMD","healthcheck.sh","--connect","--innodb_initialized"], interval: 5s, timeout: 5s, retries: 30}
  joomla-427:
    # rq-c1/php80-apache-joomla:1.0 = FROM php:8.0-apache@sha256:c87b4c94… + docker-php-ext-install mysqli
    image: rq-c1/php80-apache-joomla@sha256:91c0b3c0c293ab2825d08481240086bc0cba86911d84679e141597edcb788f86
    container_name: topup-jl427
    restart: unless-stopped
    # documented Joomla installer switch: skip the "remote DB host" ownership
    # file dance (db is a separate container). Installer-only; no runtime effect.
    environment: {JOOMLA_INSTALLATION_DISABLE_LOCALHOST_CHECK: "1"}
    ports: ["127.0.0.1:8920:80"]
    volumes: ["../joomla/427:/var/www/html"]
    networks: [topup-net]
  joomla-428:
    image: rq-c1/php80-apache-joomla@sha256:91c0b3c0c293ab2825d08481240086bc0cba86911d84679e141597edcb788f86
    container_name: topup-jl428
    restart: unless-stopped
    environment: {JOOMLA_INSTALLATION_DISABLE_LOCALHOST_CHECK: "1"}
    ports: ["127.0.0.1:8921:80"]
    volumes: ["../joomla/428:/var/www/html"]
    networks: [topup-net]
  wp-6553:
    # WordPress 6.7.1 + PHP 8.2.27 (digest reused from the existing lab stacks)
    image: wordpress@sha256:43693c77589bcad6f6babe86fa14728a19224445ff883c4dbf8660d260dd547b
    container_name: topup-wp
    restart: unless-stopped
    depends_on: {db: {condition: service_healthy}}
    environment:
      WORDPRESS_DB_HOST: db:3306
      WORDPRESS_DB_NAME: wp_6553
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: ${DB_PASSWORD:-changeme}
      WORDPRESS_TABLE_PREFIX: wp_
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_AUTO_UPDATE_CORE', false);
    ports: ["127.0.0.1:8930:80"]
    volumes: ["../wordpress:/var/www/html"]
    networks: [topup-net]
