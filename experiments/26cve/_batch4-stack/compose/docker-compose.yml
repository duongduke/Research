# Batch 4 stack — Roundcube cases
#   CVE-2020-12640  path traversal/LFI   1.4.3 / 1.4.4
#   CVE-2020-12641  RCE (im_convert_path) 1.4.3 / 1.4.4
#   CVE-2021-44026  SQLi (search)        1.4.11 / 1.4.12
#   CVE-2023-5631   stored XSS (SVG)     1.5.3 / 1.5.5
#   CVE-2024-37383  stored XSS (SVG animate) 1.5.6 / 1.5.7
# Loopback only. No CGI. RCE = marker only.
name: batch4-lab
networks:
  b4-net: {name: b4-net, driver: bridge}
volumes:
  mariadb-data:
x-rc-env: &rcenv
  ROUNDCUBEMAIL_DB_TYPE: mysql
  ROUNDCUBEMAIL_DB_HOST: db
  ROUNDCUBEMAIL_DB_PORT: "3306"
  ROUNDCUBEMAIL_DB_USER: labuser
  ROUNDCUBEMAIL_DB_PASSWORD: ${DB_PASSWORD:-changeme}
  ROUNDCUBEMAIL_DEFAULT_HOST: imap
  ROUNDCUBEMAIL_DEFAULT_PORT: "3143"
  ROUNDCUBEMAIL_SMTP_SERVER: imap
  ROUNDCUBEMAIL_SMTP_PORT: "3025"
services:
  db:
    image: mariadb@sha256:7db29378d4fdab73f8123bbc2b48905c90d1a4b00cf848b028f1e81e623257f2
    container_name: b4-db
    restart: unless-stopped
    environment: {MARIADB_ROOT_PASSWORD: "${MARIADB_ROOT_PASSWORD:-changeme}"}
    ports: ["127.0.0.1:13311:3306"]
    volumes: [mariadb-data:/var/lib/mysql, ./db-init:/docker-entrypoint-initdb.d:ro]
    networks: [b4-net]
    healthcheck: {test: ["CMD","healthcheck.sh","--connect","--innodb_initialized"], interval: 5s, timeout: 5s, retries: 30}
  imap:
    image: greenmail/standalone@sha256:d6db42a4fc258fec0948b1ae7b579fd06947cc92087c162ec0597972a6c36850
    container_name: b4-imap
    restart: unless-stopped
    environment:
      GREENMAIL_OPTS: >-
        -Dgreenmail.setup.test.all -Dgreenmail.hostname=0.0.0.0
        -Dgreenmail.users=test:test@localhost
    ports: ["127.0.0.1:3144:3143","127.0.0.1:3026:3025"]
    networks: [b4-net]

  rc-1443:
    image: roundcube/roundcubemail@sha256:0ee2f1b7a008b719ec8e0a36020e9a4e773acc5ca9dde787742e180d7c78628c
    container_name: b4-rc-1443
    restart: unless-stopped
    depends_on: {db: {condition: service_healthy}}
    environment: {ROUNDCUBEMAIL_DB_NAME: rc_1443, <<: *rcenv}
    ports: ["127.0.0.1:8841:80"]
    networks: [b4-net]
  rc-1444:
