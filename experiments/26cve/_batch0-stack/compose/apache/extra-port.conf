# Batch 0 — CVE-2019-8942 instances.
# WordPress at 127.0.0.1:8111 must be able to fetch its own attachment URL during
# wp_crop_image()'s replication fallback (the core of the exploit). The stock image
# only listens on :80, so we add a second listener on :8111 (matching the site URL).
Listen 8111
